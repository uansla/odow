[project]
name = "odow"
version = "0.1.0"
description = "A focused desktop downloader for video, model repositories, and GitHub releases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "yt-dlp[default,deno]>=2025.1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
odow = "odow.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
