[project]
name = "odow"
version = "0.1.0"
description = "A focused desktop downloader for video, model repositories, and GitHub releases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "yt-dlp[default]>=2025.1.0",
  "huggingface-hub>=0.27",
  "requests>=2.32,<3",
]

[project.scripts]
odow = "odow.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
